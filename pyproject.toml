[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmultimodal-lab"
version = "1.0.0"
description = "The local-first, reproducible multimodal benchmark engine behind Ailumetra."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "AlbertXXuu" }
]
keywords = [
  "multimodal",
  "vision-language-model",
  "benchmark",
  "computer-vision",
  "machine-learning"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
studio = [
  "gradio>=6.22,<7",
]
qwen3-vl = [
  "accelerate>=1.1",
  "av>=14",
  "numpy>=1.26",
  "pillow>=10",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.57",
]
smolvlm2 = [
  "accelerate>=1.1",
  "av>=14",
  "num2words>=0.5.14",
  "numpy>=1.26",
  "pillow>=10",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.57",
]

[project.scripts]
oml = "openmultimodal_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openmultimodal_lab = ["assets/fonts/*.b64", "assets/fonts/*.txt"]
