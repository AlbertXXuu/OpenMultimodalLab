name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Check installed requirements
        run: python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  repository-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check repository artifacts
        run: python scripts/check_repository.py
      - name: Validate runtime license audit policy
        run: python scripts/audit_runtime_licenses.py --validate-policy-only
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
      - name: Smoke-test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/oml" doctor
          "$RUNNER_TEMP/wheel-venv/bin/oml" run \
            --dataset "$GITHUB_WORKSPACE/examples/tasks/smoke.jsonl" \
            --media-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/wheel-smoke.jsonl"
          "$RUNNER_TEMP/wheel-venv/bin/oml" report \
            --input "$RUNNER_TEMP/wheel-smoke.jsonl"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c \
            "import openmultimodal_lab; from pathlib import Path; location = Path(openmultimodal_lab.__file__).resolve(); workspace = Path('$GITHUB_WORKSPACE').resolve(); assert not location.is_relative_to(workspace), location; print(f'Imported installed package from: {location}')"
