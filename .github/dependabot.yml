version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    # The v1.0 runtime constraints remain bound to the signed release evidence.
    exclude-paths:
      - "requirements/model-windows-py311-constraints.txt"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
